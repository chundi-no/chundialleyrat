[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# L’ancienne page CV est maintenant sur l’accueil
[[redirects]]
  from = "/chundi-alleyrat"
  to = "/#cv"
  status = 301
[[redirects]]
  from = "/chundi-alleyrat/*"
  to = "/#cv"
  status = 301
